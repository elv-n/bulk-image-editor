name: Build & Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File Executable
        run: |
          dotnet publish ImageResizerCSharp/ImageResizerCSharp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Rename Executable for Release
        shell: pwsh
        run: |
          Move-Item -Path "./publish/ImageResizerCSharp.exe" -Destination "./publish/BulkImageResizer-Windows-x64.exe" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/BulkImageResizer-Windows-x64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
